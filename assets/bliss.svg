<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-label="Original wallpaper of green hills under a blue sky">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a66c4"/>
      <stop offset="28%" stop-color="#3d92dc"/>
      <stop offset="52%" stop-color="#8ecbf2"/>
      <stop offset="70%" stop-color="#d7f0fb"/>
      <stop offset="78%" stop-color="#c5e6c4"/>
      <stop offset="100%" stop-color="#7fbf62"/>
    </linearGradient>
    <radialGradient id="sun" cx="18%" cy="12%" r="42%">
      <stop offset="0%" stop-color="#fff6d2" stop-opacity="0.95"/>
      <stop offset="28%" stop-color="#fff1b8" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#fff1b8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="far" x1="0" y1="0" x2="0" y2="1">
