<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Page not found · Bill</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#245edb">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="error-page">
  <div class="bliss" aria-hidden="true"></div>
  <main class="window is-active" id="main">
    <div class="titlebar">
      <span class="titlebar-text">Error</span>
    </div>
    <div class="window-body">
      <div class="error-copy">
        <svg class="dialog-ico" viewBox="0 0 32 32" aria-hidden="true">
          <path fill="#ffd34d" stroke="#8a6a10" stroke-width="1" d="M16 3 30 28H2z"/>
          <rect x="14.6" y="12" width="2.8" height="8" rx="1" fill="#3a3110"/>
          <circle cx="16" cy="23.2" r="1.6" fill="#3a3110"/>
        </svg>
        <div>
          <p class="kicker">404</p>
          <h1>Page not found</h1>
          <p class="lede">That address isn't part of this site.</p>
          <div class="error-actions">
            <a class="btn btn-primary" href="/">Back home</a>
            <a class="btn" href="https://github.com/PerfecHateyOu" target="_blank" rel="noopener noreferrer">GitHub profile<span class="sr-only"> (opens in a new tab)</span></a>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
